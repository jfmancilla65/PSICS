[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "psics"
version = "1.0.3"
license = "MIT"

authors = [
  { name="Juan F Mancilla", email="jfmancilla@gmail.com" },
]
description = "A sparse covariance selection package"
keywords = ["sics", "sparse", "sparse covariance", "selection", "inverse covariance", "covariance"]
dependencies = [
 "numpy",
 "importlib.resources",
 "matplot",
]
readme = "README.md"
requires-python = ">=3.10.12"
classifiers = [
    "Programming Language :: Python :: 3",
]

